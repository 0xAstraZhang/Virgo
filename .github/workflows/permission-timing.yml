name: Permission mode performance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/virgo/**'
      - 'ci/measure_permission_modes.py'
      - 'ci/prepare_windows_null_device.py'
      - 'tests/test_permission_timing.py'
      - '.github/workflows/permission-timing.yml'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: read
concurrency:
  group: permission-timing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  budgets:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # S5-04: Performance budgets apply across all Tier 1 platforms (Linux, macOS, Windows).
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          missing=()
          command -v bwrap >/dev/null 2>&1 || missing+=(bubblewrap)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Align Windows Server runner null device with Win11 Feature 60692039
        if: runner.os == 'Windows'
        run: uv run --no-sync python ci/prepare_windows_null_device.py
      - name: Enforce realistic-scale budgets across all permission modes
        shell: bash
        run: |
          set -u
          status=0
          for mode in no-limit read-only workspace-edit; do
            echo "::group::Mode: $mode"
            out_rel="timing-results/$mode"
            mkdir -p "$out_rel"
            uv run --no-sync python ci/measure_permission_modes.py \
              --mode "$mode" --samples 2 --repeat 2 --read-repeats 10 \
              --realistic-files 1000 --check-budgets --output "$out_rel/budget.json" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: permission-timing-${{ matrix.os }}
          path: timing-results/
          if-no-files-found: error
          retention-days: 14
