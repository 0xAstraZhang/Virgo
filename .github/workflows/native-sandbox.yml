name: Native sandbox boundaries
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/virgo/**'
      - 'tests/support/**'
      - 'ci/check_native_report.py'
      - 'tests/harness/test_sandbox_e2e.py'
      - 'tests/harness/test_macos_sandbox_e2e.py'
      - '.github/workflows/native-sandbox.yml'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: read
concurrency:
  group: native-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suites: tests/harness/test_sandbox_e2e.py
          - os: macos-latest
            suites: tests/harness/test_sandbox_e2e.py tests/harness/test_macos_sandbox_e2e.py
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      VIRGO_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Linux sandbox requirements on the test host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          missing=()
          command -v bwrap >/dev/null 2>&1 || missing+=(bubblewrap)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync --locked --dev
      - name: Exercise real native boundaries without capability skips
        run: uv run --no-sync pytest -q ${{ matrix.suites }} --junitxml=native-sandbox.xml
      - name: Reject empty, failed or skipped native reports
        if: ${{ !cancelled() }}
        run: uv run --no-sync python ci/check_native_report.py native-sandbox.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-sandbox-${{ matrix.os }}
          path: native-sandbox.xml
          if-no-files-found: error
          retention-days: 7
