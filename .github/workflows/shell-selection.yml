name: PowerShell startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [readonly, disabled, private]
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real PowerShell processes
        run: python3 ci/diagnose_powershell_startup.py '${{ matrix.mode }}' 2400
      - name: Gather native crash reports
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp -R "$(cat diagnostic-path.txt)" diagnostics/
          cp "$HOME"/Library/Logs/DiagnosticReports/pwsh* diagnostics/ 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('diagnostics').rglob('*.ips'):
              print(path)
              lines = path.read_text().splitlines()
              try:
                  report = json.loads('\n'.join(lines[1:]))
                  index = report.get('faultingThread')
                  print(json.dumps({'exception': report.get('exception'), 'faultingThread': index,
                                    'thread': report['threads'][index] if index is not None else None}))
              except Exception as error:
                  print(error)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powershell-${{ matrix.mode }}
          path: diagnostics/
          retention-days: 7
