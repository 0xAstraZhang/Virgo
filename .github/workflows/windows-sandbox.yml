name: Windows sandbox boundaries
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/virgo/**'
      - 'tests/harness/test_windows_sandbox_e2e.py'
      - '.github/workflows/windows-sandbox.yml'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: read
concurrency:
  group: windows-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Windows native isolation / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      VIRGO_REQUIRE_WINDOWS_SANDBOX_TESTS: '1'
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
      - run: uv sync --locked --dev
      - name: Record exact revision and native environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          $PSVersionTable | Format-List
          uv run --no-sync python -c "import platform,struct,sys; print(platform.platform()); print(sys.version); print(sys.executable); assert struct.calcsize('P') == 8"
      - name: Exercise actual Windows security boundaries
        run: uv run --no-sync pytest -q tests/harness/test_windows_sandbox_e2e.py --junitxml=windows-sandbox.xml
      - name: Reject empty or skipped security reports
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content windows-sandbox.xml
          $cases = @($report.SelectNodes('//testcase'))
          if ($cases.Count -eq 0) { throw 'No native Windows security cases executed' }
          $problems = @($report.SelectNodes('//testcase/failure | //testcase/error | //testcase/skipped'))
          if ($problems.Count -ne 0) { throw "Native security report contains $($problems.Count) failures/errors/skips" }
          Write-Output "Validated $($cases.Count) real Windows security cases with zero failures, errors or skips"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-sandbox-${{ matrix.os }}
          path: windows-sandbox.xml
          if-no-files-found: error
          retention-days: 14
      - name: Trace the existing startup failure with Windows loader snaps
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: |
          $debuggers = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64'
          $gflags = Join-Path $debuggers 'gflags.exe'
          $cdb = Join-Path $debuggers 'cdb.exe'
          if (!(Test-Path $gflags) -or !(Test-Path $cdb)) {
            throw "Windows debugging tools are unavailable at $debuggers"
          }
          $python = (Resolve-Path '.venv\Scripts\python.exe').Path
          # Trace native initialization after bcrypt loads without changing the child token.
          @'
          sxn av
          sxn *
          sxn ibp
          sxe -c "$$><windows-bcrypt-commands.txt; g" ld:bcrypt.dll
          g
          '@ | Set-Content -Encoding ascii windows-loader-commands.txt
          @'
          bp ntdll!NtOpenFile "$$><windows-open-commands.txt"
          bp ntdll!EtwEventRegister "$$><windows-etw-commands.txt"
          '@ | Set-Content -Encoding ascii windows-bcrypt-commands.txt
          @'
          .printf "VIRGO_NATIVE_OPEN pid=%x tid=%x desired=%08x caller=%y name=%msu\n", @$tpid, @$tid, @edx, poi(@rsp), poi(@r8+0x10)
          bp /1 poi(@rsp) "$$><windows-open-return.txt"
          gc
          '@ | Set-Content -Encoding ascii windows-open-commands.txt
          @'
          .printf "VIRGO_NATIVE_RETURN pid=%x tid=%x status=%08x caller=%y\n", @$tpid, @$tid, @eax, @rip
          gc
          '@ | Set-Content -Encoding ascii windows-open-return.txt
          @'
          .printf "VIRGO_ETW_REGISTER pid=%x tid=%x caller=%y provider=", @$tpid, @$tid, poi(@rsp)
          dd @rcx L4
          bp /1 poi(@rsp) "$$><windows-etw-return.txt"
          gc
          '@ | Set-Content -Encoding ascii windows-etw-commands.txt
          @'
          .printf "VIRGO_ETW_RETURN pid=%x tid=%x status=%08x caller=%y\n", @$tpid, @$tid, @eax, @rip
          gc
          '@ | Set-Content -Encoding ascii windows-etw-return.txt
          try {
            & $gflags /i pwsh.exe +sls
            if ($LASTEXITCODE -ne 0) { throw 'Could not enable PowerShell loader snaps' }
            # Diagnostic rerun only: preserve the original 18-case acceptance report.
            & $cdb -o -G -hd -xn av -xn '*' -cf windows-loader-commands.txt -logo windows-loader.log $python -m pytest -q tests/harness/test_windows_sandbox_e2e.py::test_private_host_files_denied_with_positive_workspace_control --junitxml=windows-loader-diagnostic.xml
            Write-Output "Diagnostic debugger exit code: $LASTEXITCODE"
          } finally {
            & $gflags /i pwsh.exe -sls
          }
      - name: Observe runtime object ACLs and bounded capability startup
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        run: uv run --no-sync python ci/windows_runtime_diagnostics.py | Tee-Object windows-runtime-diagnostic.log
      - name: Preserve Windows startup diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-loader-${{ matrix.os }}
          path: |
            windows-loader.log
            windows-loader-diagnostic.xml
            windows-runtime-diagnostic.log
          if-no-files-found: warn
          retention-days: 14
