name: Diagnostics / Windows TUI approval
on:
  push:
    branches:
      - diagnostics/windows-approval
permissions:
  contents: read
jobs:
  approval:
    name: Diagnose intermittent persistent approval
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      VIRGO_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - name: Check out the exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
      - run: uv sync --locked --dev
      - name: Record exact revision and native environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          $PSVersionTable | Format-List
          uv run --no-sync python -c "import platform,struct,sys; print(platform.platform()); print(sys.version); print(sys.executable); assert struct.calcsize('P') == 8"
      - name: Run the original positive control and repeated persistent approval case
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Path approval-diagnostics -Force | Out-Null
          $case = 'tests/cli/tui/test_app.py::test_resource_approval_controls_one_file_write'
          $variants = @('once-y', 'always-a', 'always-a', 'always-a', 'always-a', 'always-a')
          for ($index = 0; $index -lt $variants.Count; $index++) {
            $variant = $variants[$index]
            $label = '{0:D2}-{1}' -f ($index + 1), $variant
            $reportPath = "approval-diagnostics/$label.xml"
            $logPath = "approval-diagnostics/$label.log"
            Write-Output "Running original case $variant in a fresh pytest process ($label)"
            & uv run --no-sync pytest -vv --tb=long -rA --maxfail=1 "${case}[$variant]" "--junitxml=$reportPath" 2>&1 | Tee-Object -FilePath $logPath
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) { exit $testExit }
            [xml]$report = Get-Content $reportPath
            $cases = @($report.SelectNodes('//testcase'))
            $problems = @($report.SelectNodes('//testcase/failure | //testcase/error | //testcase/skipped'))
            if ($cases.Count -ne 1 -or $problems.Count -ne 0) {
              throw "Expected one real passing case for $label; got $($cases.Count) cases and $($problems.Count) failures/errors/skips"
            }
          }
          Write-Output 'All diagnostic attempts passed; the intermittent failure was not reproduced.'
      - name: Preserve every completed attempt and the first failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: windows-approval-diagnostics-${{ github.run_attempt }}
          path: approval-diagnostics/
          if-no-files-found: error
          retention-days: 14
