name: Cross-platform PR comparison
run-name: Cross-platform comparison for PR ${{ inputs.pr_number || github.event.pull_request.number || 'latest' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (blank selects the newest open PR)
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      base_repository: ${{ steps.target.outputs.base_repository }}
      head_repository: ${{ steps.target.outputs.head_repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check revision resolution end to end
        run: python ci/check_resolution.py
      - name: Resolve immutable PR revisions
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python ci/compare_tests.py resolve
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target
          path: target.json
          if-no-files-found: error

  test:
    needs: resolve
    name: ${{ matrix.os }} / ${{ matrix.revision }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        revision: [base, head]
    env:
      PYTHONUTF8: '1'
      UV_PYTHON: '3.13'
    steps:
      - name: Check out comparison tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-config
          persist-credentials: false
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.revision == 'base' && needs.resolve.outputs.base_repository || needs.resolve.outputs.head_repository }}
          ref: ${{ matrix.revision == 'base' && needs.resolve.outputs.base_sha || needs.resolve.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh curl
      - name: Install locked project dependencies
        working-directory: candidate
        run: uv sync --locked --dev
      - name: Run complete pytest suite
        # Preserve failures in artifacts; the comparison job decides whether they are new.
        continue-on-error: true
        working-directory: candidate
        env:
          TEST_SHA: ${{ matrix.revision == 'base' && needs.resolve.outputs.base_sha || needs.resolve.outputs.head_sha }}
        shell: bash
        run: >-
          uv run --no-sync python ../ci-config/ci/compare_tests.py run
          --project . --output ../result
          --platform '${{ matrix.os }}' --label '${{ matrix.revision }}' --sha "$TEST_SHA"
      - name: Preserve raw and normalized results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}-${{ matrix.revision }}
          path: result/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare failures and coverage
    needs: [resolve, test]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target
          path: .
      - name: Compare individual test outcomes
        run: python ci/compare_tests.py compare --reports reports --target target.json --output comparison
      - name: Preserve comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: |
            comparison.md
            comparison.json
          if-no-files-found: error
          retention-days: 14
