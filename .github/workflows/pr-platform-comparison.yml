name: Cross-platform CI
run-name: Cross-platform CI · ${{ github.event_name == 'push' && format('main {0}', github.sha) || format('PR {0}', inputs.pr_number || github.event.pull_request.number || 'latest (manual)') }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (blank selects the newest open PR; always runs full tests)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PYTHONUTF8: '1'
  UV_PYTHON: '3.13'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.target.outputs.base_sha }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      head_repository: ${{ steps.target.outputs.head_repository }}
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable event revisions
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 ci/compare_tests.py resolve
      - name: Classify changes between resolved revisions
        id: changes
        run: python3 ci/compare_tests.py classify --target target.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target
          path: target.json
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Lint and CI acceptance
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.head_repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --dev
      - name: Lint Python
        run: uv run --no-sync ruff check
      - name: Validate workflow syntax
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Run CI acceptance checks end to end
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python ci/checks/resolution.py & pid_res=$!
          uv run --no-sync python ci/checks/parallel.py & pid_par=$!
          uv run --no-sync python ci/checks/comparison.py & pid_cmp=$!
          uv run --no-sync python ci/checks/powershell_cache.py & pid_ps=$!
          status=0
          wait "$pid_res" || status=1
          wait "$pid_par" || status=1
          wait "$pid_cmp" || status=1
          wait "$pid_ps" || status=1
          exit "$status"

  test:
    needs: [resolve]
    if: needs.resolve.outputs.run_tests == 'true'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out CI tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ci-config
          sparse-checkout: ci
          persist-credentials: false
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.head_repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.13'
          working-directory: candidate
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          missing=()
          command -v zsh >/dev/null 2>&1 || missing+=(zsh)
          command -v curl >/dev/null 2>&1 || missing+=(curl)
          command -v bwrap >/dev/null 2>&1 || missing+=(bubblewrap)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install locked project dependencies
        working-directory: candidate
        run: uv sync --locked --dev
      - name: Record environment
        working-directory: candidate
        run: uv run --no-sync python -c "import os, platform, shutil, sys; print(sys.version); print(platform.platform(), 'cpus=', os.cpu_count()); print({s:shutil.which(s) for s in ('bash','zsh','pwsh','powershell','curl')})"
      - name: Align Windows Server runner null device with Win11 Feature 60692039
        if: runner.os == 'Windows'
        working-directory: candidate
        run: uv run --no-sync python ../ci-config/ci/prepare_windows_null_device.py
      - name: Run complete pytest suite
        # Only test failures are deferred; the final job validates reports AND job results.
        continue-on-error: true
        working-directory: candidate
        env:
          TEST_SHA: ${{ needs.resolve.outputs.head_sha }}
        shell: bash
        run: |
          uv run --no-sync python ../ci-config/ci/compare_tests.py run \
            --project . --output ../result \
            --platform '${{ matrix.os }}' --sha "$TEST_SHA"
      - name: Build and smoke test installed distribution
        if: runner.os == 'Linux'
        working-directory: candidate
        shell: bash
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv export --quiet --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/locked-requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-smoke" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --require-hashes --requirements "$RUNNER_TEMP/locked-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/virgo" --help
      - name: Preserve raw and normalized results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.os }}
          path: result/
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Summarize and enforce results
    needs: [resolve, checks, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: ci
          persist-credentials: false
      - name: Download test reports
        if: needs.resolve.outputs.run_tests == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: reports
      - name: Download resolved target
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: target
          path: .
      - name: Summarize and enforce results
        run: >-
          python3 ci/compare_tests.py summarize
          --reports reports --target target.json --output summary
          --resolve-result '${{ needs.resolve.result }}'
          --checks-result '${{ needs.checks.result }}'
          --test-result '${{ needs.test.result }}'
      - name: Preserve summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary
          path: |
            summary.md
            summary.json
          if-no-files-found: error
          retention-days: 14
